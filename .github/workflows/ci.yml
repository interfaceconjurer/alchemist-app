name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client --include=dev
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix client --audit-level=high
      - run: npm test
      - run: npm test --prefix client -- --run
      - run: npm run test:profile --prefix client
      - run: npx --prefix client playwright install --with-deps chromium
      - run: npm run test:e2e:resilience --prefix client
      - run: npm run check:bundle --prefix client
