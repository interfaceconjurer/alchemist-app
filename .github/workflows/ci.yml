name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The browser compatibility suite alone takes about 15 minutes on a hosted runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client --include=dev
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix client --audit-level=high
      - run: npm test
      - run: npm test --prefix client -- --run
      - run: npm run test:profile --prefix client
      - run: npx --prefix client playwright install --with-deps chromium webkit
      - run: npm run test:e2e:compatibility --prefix client
      - run: npm run check:bundle --prefix client
      - name: Retain browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: client/test-results/
          if-no-files-found: ignore
          retention-days: 7
